<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус аккаунта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Аккаунт: <span id="status-text">Загрузка...</span></h1>
    <button id="toggle-btn" disabled>Подключение...</button>
    <p id="info"></p>
    
    <!-- Чекбокс для уведомления -->
    <div id="checkbox-container" style="display: none; margin-top: 15px;">
        <label>
            <input type="checkbox" id="notify-when-free">
            Уведомить, когда освободится
        </label>
    </div>

    <!-- Блок с именем пользователя -->
    <div id="user-block">
        Вы вошли как: <b id="my-name-display">...</b> 
        <a href="#" id="change-name">(сменить)</a>
    </div>

    <button id="history-btn" style="margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 5px;">История сессий</button>

    <!-- Модальное окно для истории -->
    <div id="history-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;">
            <h2>История сессий</h2>
            <div id="history-list" style="margin: 15px 0;"></div>
            <button id="close-history" style="width: 100%; padding: 10px; background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer;">Закрыть</button>
        </div>
    </div>

    <!-- Скрытое окно для ввода имени -->
    <div id="name-editor" style="display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 250px; margin: 20px auto; text-align: center;">
        <p style="margin-top: 0; font-size: 0.9em; color: #333;">Введите ваше имя:</p>
        <input type="text" id="name-input" placeholder="Например, Гоша" style="padding: 10px; width: 90%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
        <button id="save-name-btn" style="padding: 10px 15px; background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;">Сохранить</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
