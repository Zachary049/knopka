<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус аккаунта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Аккаунт: <span id="status-text">Загрузка...</span></h1>
    <button id="toggle-btn" disabled>Подключение...</button>
    <p id="info"></p>

    <!-- Блок действий -->
    <div id="actions" class="actions">
        <label id="notify-label" class="action-item">
            <input type="checkbox" id="notifyWhenFree">
            <span>Уведомить, когда освободится</span>
        </label>

        <button id="request-btn" class="action-btn" style="display:none;">
            Попросить освободить
        </button>

        <div id="request-status" class="request-status" style="display:none;">
            <span class="spinner"></span>
            <span id="request-status-text">Ожидаем ответа…</span>
        </div>
    </div>

    <!-- Блок с именем пользователя -->
    <div id="user-block">
        Вы вошли как: <b id="my-name-display">...</b>
        <a href="#" id="change-name">(сменить)</a>
    </div>

    <!-- Окно ввода имени -->
    <div id="name-editor" style="display: none;">
        <p>Введите ваше имя:</p>
        <input type="text" id="name-input" placeholder="Например, Гоша">
        <button id="save-name-btn">Сохранить</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
