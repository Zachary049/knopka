<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус аккаунта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Аккаунт: <span id="status-text">Загрузка...</span></h1>
    <button id="toggle-btn" disabled>Подключение...</button>
    <p id="info"></p>
    
    <!-- Блок с именем пользователя -->
    <div id="user-block">
        Вы вошли как: <b id="my-name-display">...</b> 
        <a href="#" id="change-name">(сменить)</a>
    </div>

    <!-- Скрытое окно для ввода имени (вместо prompt) -->
    <div id="name-editor" style="display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 250px; margin: 20px auto; text-align: center;">
        <p style="margin-top: 0; font-size: 0.9em; color: #333;">Введите ваше имя:</p>
        <input type="text" id="name-input" placeholder="Например, Гоша" style="padding: 10px; width: 90%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
        <button id="save-name-btn" style="padding: 10px 15px; background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;">Сохранить</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
